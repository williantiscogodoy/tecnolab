{# Lógica del cuadro de detalle del producto (técnico y administrador). Expone TL.producto.abrirDetalle(url) y TL.producto.abrirRetiro(url) (la url del detalle del producto). #}
<script>
  (function () {
    window.TL = window.TL || {};

    function $(id) { return document.getElementById(id); }
    function el(tag, cls, txt) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (txt !== undefined) e.textContent = txt;
      return e;
    }
    function badge(cls, txt) { return el('span', 'badge ' + cls, txt); }
    function icono(id) {
      var ns = 'http://www.w3.org/2000/svg';
      var s = document.createElementNS(ns, 'svg'); s.setAttribute('class', 'ico');
      var u = document.createElementNS(ns, 'use'); u.setAttribute('href', '#' + id);
      s.appendChild(u); return s;
    }
    function csrf() {
      var i = document.querySelector('#formRetiro [name="csrfmiddlewaretoken"]');
      return i ? i.value : '';
    }
    function pedir(url) {
      return fetch(url, { headers: { 'X-Requested-With': 'fetch' }, credentials: 'same-origin' })
        .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); });
    }
    function enviar(url, datos) {
      return fetch(url, {
        method: 'POST', credentials: 'same-origin',
        headers: { 'X-CSRFToken': csrf(), 'X-Requested-With': 'fetch', 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(datos || {}).toString()
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) throw new Error(j.error || 'No se pudo completar la acción. Inténtalo de nuevo.');
          return j;
        });
      });
    }
    function estadoStock(stock, minimo) { return stock === 0 ? 'out' : stock <= minimo ? 'low' : 'in'; }
    var ETIQUETA = { out: 'Agotado', low: 'Stock bajo', 'in': 'Disponible' };

    /* ---------- Retirar pieza: venta a un cliente (efectivo, QR o fiado) ---------- */
    var dlgR = $('dlgRetiro'), formR = $('formRetiro');
    var cant = $('rCantidad'), precio = $('rPrecio'), stockR = 0, compraR = 0, ventaR = 0;
    var cliQ = $('rClienteQ'), cliRes = $('rClienteRes'), cliErr = $('rClienteErr');
    var timerCli = null, seqCli = 0;
    var cajaR = 'caja productos';   // se ajusta según la categoría del producto que se retira
    function ayudaPago(metodo) {
      if (metodo === 'FIADO') return 'Se anota como deuda del cliente. No entra a caja hasta que pague; entonces irá a la ' + cajaR + '.';
      return 'El dinero entra a la ' + cajaR + ', ' + (metodo === 'QR' ? 'por QR.' : 'en efectivo.');
    }

    function dinero(n) { return n.toLocaleString('es-BO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function clamp(n) { n = parseInt(n, 10); if (isNaN(n) || n < 1) n = 1; return Math.min(n, stockR); }
    function metodoActual() { return formR.querySelector('input[name="metodo"]:checked').value; }

    function recalcular() {
      var n = Math.min(Math.max(parseInt(cant.value, 10) || 1, 1), Math.max(stockR, 1));
      var p = parseFloat(precio.value);
      var total = $('rTotal'), gan = $('rGanancia'), aviso = $('rAviso');
      if (isNaN(p) || p < 0) { total.textContent = '—'; gan.textContent = ''; gan.className = ''; aviso.hidden = true; return; }
      total.textContent = 'Bs ' + dinero(p * n);
      var g = (p - compraR) * n;
      gan.textContent = (g < 0 ? 'Pérdida Bs ' : 'Ganancia Bs ') + dinero(Math.abs(g));
      gan.className = g < 0 ? 'neg' : 'pos';
      aviso.hidden = !(p < compraR);
      if (p < compraR) aviso.textContent = 'El precio está por debajo de lo que costó (Bs ' + dinero(compraR) + ' c/u).';
    }
    function pintarAyudaPago() { $('rMetodoAyuda').textContent = ayudaPago(metodoActual()); }

    /* Cliente: buscar, elegir o crear al momento */
    function errorCliente(texto) { cliErr.hidden = !texto; cliErr.textContent = texto || ''; }
    function inicial(nombre) { return (nombre || '?').trim().charAt(0).toUpperCase(); }
    function datosCliente(c) {
      var partes = [];
      if (c.telefono) partes.push(c.telefono);
      return { texto: partes.join(' · '), debe: c.deuda > 0 ? 'Debe Bs ' + dinero(c.deuda) : '' };
    }
    function elegirCliente(c) {
      $('rCliente').value = c.id;
      $('rSelAv').textContent = inicial(c.nombre);
      $('rSelNombre').textContent = c.nombre;
      var d = datosCliente(c), small = $('rSelDatos');
      small.textContent = [d.texto, d.debe].filter(Boolean).join(' · ') || 'Sin teléfono';
      small.className = c.deuda > 0 ? 'debe' : '';
      $('rClienteSel').hidden = false; $('rBuscar').hidden = true; errorCliente('');
    }
    function reiniciarCliente() {
      $('rCliente').value = ''; $('rClienteSel').hidden = true; $('rBuscar').hidden = false;
      $('rNuevo').hidden = true; cliQ.value = ''; cliRes.innerHTML = ''; errorCliente('');
    }
    function pintarClientes(lista) {
      cliRes.innerHTML = '';
      if (!lista.length) {
        var v = el('li', 'r-vacio', 'No hay clientes con ese nombre. Puedes crear uno nuevo.');
        cliRes.appendChild(v); return;
      }
      lista.forEach(function (c) {
        var li = el('li'), b = el('button'); b.type = 'button';
        b.appendChild(el('span', 'r-av', inicial(c.nombre)));
        var t = el('span', 'r-txt'); t.appendChild(el('strong', null, c.nombre));
        var d = datosCliente(c);
        var small = el('small', c.deuda > 0 ? 'debe' : null, [d.texto, d.debe].filter(Boolean).join(' · ') || 'Sin teléfono');
        t.appendChild(small); b.appendChild(t);
        b.addEventListener('click', function () { elegirCliente(c); });
        li.appendChild(b); cliRes.appendChild(li);
      });
    }
    function buscarClientes() {
      var yo = ++seqCli;
      pedir(dlgR.dataset.buscar + '?q=' + encodeURIComponent(cliQ.value.trim()))
        .then(function (j) { if (yo === seqCli) pintarClientes(j.resultados || []); })
        .catch(function () { if (yo === seqCli) errorCliente('No se pudo buscar clientes. Inténtalo de nuevo.'); });
    }
    cliQ.addEventListener('input', function () { clearTimeout(timerCli); timerCli = setTimeout(buscarClientes, 220); });
    cliQ.addEventListener('keydown', function (e) { if (e.key === 'Enter') e.preventDefault(); });
    $('rCambiar').addEventListener('click', function () { reiniciarCliente(); buscarClientes(); cliQ.focus(); });
    $('rNuevoBtn').addEventListener('click', function () {
      var abrir = $('rNuevo').hidden; $('rNuevo').hidden = !abrir;
      if (abrir) { $('rNuevoNombre').value = cliQ.value.trim(); $('rNuevoTel').value = ''; $('rNuevoNombre').focus(); }
    });
    function guardarNuevoCliente() {
      var b = $('rNuevoGuardar'); b.disabled = true;
      enviar(dlgR.dataset.rapido, { nombre: $('rNuevoNombre').value, telefono: $('rNuevoTel').value })
        .then(function (c) { elegirCliente(c); })
        .catch(function (e) { errorCliente(e.message); })
        .then(function () { b.disabled = false; });
    }
    $('rNuevoGuardar').addEventListener('click', guardarNuevoCliente);
    ['rNuevoNombre', 'rNuevoTel'].forEach(function (id) {
      $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); guardarNuevoCliente(); } });
    });

    /* d: los datos del producto (la misma respuesta del cuadro de detalle) */
    function abrirRetiro(d) {
      stockR = parseInt(d.stock, 10) || 0;
      compraR = parseFloat(d.precio_compra) || 0; ventaR = parseFloat(d.precio_venta) || 0;
      formR.action = d.retirar_url;
      cajaR = d.es_tecnica ? 'caja técnico' : 'caja productos';
      $('rNext').value = location.pathname + location.search;
      $('rNombre').textContent = d.nombre;
      $('rStock').textContent = stockR;
      $('rCompra').textContent = 'Bs ' + dinero(compraR);
      $('rVenta').textContent = 'Bs ' + dinero(ventaR);
      cant.max = stockR; cant.value = 1;
      precio.value = ventaR.toFixed(2);
      $('rNota').value = '';
      formR.querySelector('input[name="metodo"][value="EFECTIVO"]').checked = true;
      reiniciarCliente(); recalcular(); pintarAyudaPago();
      $('rConfirmar').disabled = false;
      dlgR.showModal();
      buscarClientes(); cliQ.focus();
    }
    function abrirRetiroDesde(url) {
      pedir(url).then(abrirRetiro).catch(function () { window.alert('No se pudo cargar el producto. Inténtalo de nuevo.'); });
    }

    $('rMenos').addEventListener('click', function () { cant.value = clamp((parseInt(cant.value, 10) || 1) - 1); recalcular(); });
    $('rMas').addEventListener('click', function () { cant.value = clamp((parseInt(cant.value, 10) || 0) + 1); recalcular(); });
    cant.addEventListener('input', recalcular);
    cant.addEventListener('change', function () { cant.value = clamp(cant.value); recalcular(); });
    precio.addEventListener('input', recalcular);
    formR.querySelectorAll('input[name="metodo"]').forEach(function (r) { r.addEventListener('change', pintarAyudaPago); });
    $('rCancelar').addEventListener('click', function () { dlgR.close(); });
    dlgR.addEventListener('click', function (e) { if (e.target === dlgR) dlgR.close(); });
    formR.addEventListener('submit', function (e) {
      cant.value = clamp(cant.value);
      if (!$('rCliente').value) {
        e.preventDefault();
        errorCliente('Elige el cliente que se lleva la pieza.');
        if (!$('rBuscar').hidden) cliQ.focus();
        return;
      }
      if (isNaN(parseFloat(precio.value)) || parseFloat(precio.value) < 0) {
        e.preventDefault(); precio.focus(); return;
      }
      setTimeout(function () { $('rConfirmar').disabled = true; }, 0);   // evita retirar dos veces
    });

    /* ---------- Detalle del producto ---------- */
    var dlgP = $('dlgProd');
    var imgs = [], idx = 0;
    var pImg = $('pImg'), pPh = $('pPh'), pPrev = $('pPrev'), pNext = $('pNext'), pCount = $('pCount'), pThumbs = $('pThumbs');
    var actual = null, actualUrl = '', pila = [];   // pila: productos por los que se pasó (para "Volver")

    // Las imágenes pasan solas cada 3 segundos. Hay un botón para pausar (y no se mueven solas si la
    // persona pidió menos movimiento en su sistema). Al elegir una imagen a mano, la cuenta empieza de nuevo.
    var INTERVALO = 3000, timerAuto = null, pausadoPorUsuario = false;
    var menosMovimiento = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    var pAuto = $('pAuto'), PAUSA = 'M7 5h3v14H7zM14 5h3v14h-3z', PLAY = 'M8 5v14l11-7z';
    function detenerAuto() { clearInterval(timerAuto); timerAuto = null; }
    function iniciarAuto() {
      detenerAuto();
      if (imgs.length < 2 || pausadoPorUsuario || (menosMovimiento && menosMovimiento.matches)) return;
      timerAuto = setInterval(function () { if (dlgP.open) mostrarImagen(idx + 1); }, INTERVALO);
    }
    function pintarBotonAuto() {
      pAuto.hidden = imgs.length < 2;
      pAuto.setAttribute('aria-pressed', String(pausadoPorUsuario));
      pAuto.setAttribute('aria-label', pausadoPorUsuario ? 'Reanudar el paso automático de imágenes' : 'Pausar el paso automático de imágenes');
      pAuto.title = pausadoPorUsuario ? 'Reanudar' : 'Pausar';
      pAuto.querySelector('path').setAttribute('d', pausadoPorUsuario ? PLAY : PAUSA);
    }
    pAuto.addEventListener('click', function () { pausadoPorUsuario = !pausadoPorUsuario; pintarBotonAuto(); iniciarAuto(); });

    function mostrarImagen(i) {
      idx = (i + imgs.length) % imgs.length;
      pImg.src = imgs[idx];
      pCount.textContent = (idx + 1) + ' / ' + imgs.length;
      pThumbs.querySelectorAll('button').forEach(function (b, k) { b.setAttribute('aria-current', String(k === idx)); });
    }
    function irAImagen(i) { mostrarImagen(i); iniciarAuto(); }   // al elegir a mano, la cuenta de 3 s empieza de nuevo
    function galeria(lista, nombre) {
      imgs = lista; pThumbs.innerHTML = '';
      var hay = lista.length > 0, varias = lista.length > 1;
      pImg.hidden = !hay; pPh.style.display = hay ? 'none' : '';
      pPrev.hidden = pNext.hidden = pCount.hidden = !varias;
      pImg.alt = nombre;
      if (varias) {
        lista.forEach(function (u, k) {
          var b = el('button'); b.type = 'button'; b.setAttribute('aria-label', 'Ver imagen ' + (k + 1));
          var i = el('img'); i.src = u; i.alt = ''; b.appendChild(i);
          b.addEventListener('click', function () { irAImagen(k); });
          pThumbs.appendChild(b);
        });
      }
      if (hay) mostrarImagen(0);
      pintarBotonAuto();
      iniciarAuto();
    }
    pPrev.addEventListener('click', function () { irAImagen(idx - 1); });
    pNext.addEventListener('click', function () { irAImagen(idx + 1); });
    dlgP.addEventListener('keydown', function (e) {
      if (imgs.length < 2 || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') irAImagen(idx - 1);
      if (e.key === 'ArrowRight') irAImagen(idx + 1);
    });

    /* ---------- Productos compatibles ---------- */
    var cpBuscar = $('pCompatBuscar'), cpQ = $('pCompatQ'), cpRes = $('pCompatRes'), cpSinRes = $('pCompatSinRes');
    var cpMsg = $('pCompatMsg'), cpLista = $('pCompatLista'), cpVacio = $('pCompatVacio');
    var timerBuscar = null, seqBuscar = 0, ocupado = false;

    function mensaje(texto, esError) {
      cpMsg.hidden = !texto; cpMsg.textContent = texto || '';
      cpMsg.className = 'cp-msg' + (esError ? ' err' : '');
    }
    function miniatura(it) {
      if (it.imagen) { var i = el('img', 'cp-thumb'); i.src = it.imagen; i.alt = ''; i.loading = 'lazy'; return i; }
      var d = el('div', 'cp-thumb'); d.setAttribute('aria-hidden', 'true'); d.appendChild(icono('i-image')); return d;
    }
    function textoProducto(it, conStock) {
      var t = el('span', 'cp-txt');
      t.appendChild(el('span', 'cp-name', it.nombre));
      var sub = el('span', 'cp-sub');
      var base = [it.sku, it.categoria].filter(Boolean).join(' · ');
      sub.appendChild(document.createTextNode(base));
      if (conStock) sub.appendChild(badge(estadoStock(it.stock, it.stock_minimo), it.stock + ' disp.'));
      t.appendChild(sub);
      return t;
    }

    function pintarLista() {
      var items = actual.compatibles || [];
      cpLista.innerHTML = '';
      cpVacio.hidden = items.length > 0;
      $('pCompatN').textContent = items.length ? ' (' + items.length + ')' : '';
      items.forEach(function (it) {
        var li = el('li', 'cp');
        var abrir = el('button', 'cp-main'); abrir.type = 'button';
        abrir.title = 'Ver ' + it.nombre;
        abrir.appendChild(miniatura(it)); abrir.appendChild(textoProducto(it, true));
        abrir.addEventListener('click', function () { irA(it.detalle_url); });
        li.appendChild(abrir);
        if (actual.puede_compat) {
          var x = el('button', 'cp-x'); x.type = 'button';
          x.setAttribute('aria-label', 'Quitar compatibilidad con ' + it.nombre); x.title = 'Quitar';
          x.appendChild(icono('i-x'));
          x.addEventListener('click', function () { quitar(it); });
          li.appendChild(x);
        }
        cpLista.appendChild(li);
      });
    }

    function pintarResultados(lista) {
      cpRes.innerHTML = '';
      cpSinRes.hidden = lista.length > 0;
      lista.forEach(function (it) {
        var li = el('li');
        var b = el('button', 'cp-opt'); b.type = 'button';
        b.appendChild(miniatura(it)); b.appendChild(textoProducto(it, false));
        var mas = el('span', 'cp-add'); mas.appendChild(icono('i-plus')); b.appendChild(mas);
        b.setAttribute('aria-label', 'Añadir ' + it.nombre + ' como compatible');
        b.addEventListener('click', function () { agregar(it, li); });
        li.appendChild(b); cpRes.appendChild(li);
      });
    }

    function buscar() {
      if (!actual || !actual.puede_compat) return;
      var yo = ++seqBuscar, que = actual;
      pedir(actual.compat_buscar_url + '?q=' + encodeURIComponent(cpQ.value.trim()))
        .then(function (j) { if (yo === seqBuscar && que === actual) pintarResultados(j.resultados || []); })
        .catch(function () { if (yo === seqBuscar) mensaje('No se pudo buscar. Inténtalo de nuevo.', true); });
    }

    function alternarBuscar() {
      var abrir = cpBuscar.hidden;
      cpBuscar.hidden = !abrir;
      var boton = $('pCompatAdd'); if (boton) boton.setAttribute('aria-expanded', String(abrir));
      if (abrir) {
        mensaje('');
        cpQ.value = '';
        buscar();
        cpBuscar.scrollIntoView({ block: 'nearest' });
        cpQ.focus();
      }
    }
    cpQ.addEventListener('input', function () { clearTimeout(timerBuscar); timerBuscar = setTimeout(buscar, 220); });

    function agregar(it, li) {
      if (ocupado) return;
      ocupado = true; var que = actual;
      enviar(actual.compat_agregar_url, { otro: it.id })
        .then(function (j) {
          if (que !== actual) return;
          actual.compatibles = j.compatibles; pintarLista();
          li.remove(); cpSinRes.hidden = cpRes.children.length > 0;
          mensaje(j.mensaje);
        })
        .catch(function (e) { mensaje(e.message, true); })
        .then(function () { ocupado = false; });
    }
    function quitar(it) {
      if (ocupado || !window.confirm('¿Quitar la compatibilidad con “' + it.nombre + '”?')) return;
      ocupado = true; var que = actual;
      enviar(it.quitar_url)
        .then(function (j) {
          if (que !== actual) return;
          actual.compatibles = j.compatibles; pintarLista(); mensaje(j.mensaje);
          if (!cpBuscar.hidden) buscar();   // el producto quitado vuelve a aparecer como opción
        })
        .catch(function (e) { mensaje(e.message, true); })
        .then(function () { ocupado = false; });
    }

    function pintarCompat(d) {
      var hay = d.usa_compatibilidad || (d.compatibles && d.compatibles.length > 0);
      $('pCompat').hidden = !hay;
      cpBuscar.hidden = true; cpQ.value = ''; cpRes.innerHTML = ''; mensaje('');
      if (hay) pintarLista();
    }

    /* ---------- Pintar el detalle ---------- */
    function pintarDetalle(d) {
      galeria(d.imagenes, d.nombre);

      var volver = $('pVolver');
      volver.hidden = pila.length === 0;
      if (pila.length) volver.querySelector('span').textContent = 'Volver a ' + pila[pila.length - 1].nombre;

      var b = $('pBadges'); b.innerHTML = '';
      if (d.es_tecnica) b.appendChild(badge('tec', 'Técnico'));
      var c = el('span', 'sub', d.categoria); c.style.margin = '0'; c.style.alignSelf = 'center'; b.appendChild(c);

      $('pNombre').textContent = d.nombre;
      var sku = $('pSku');
      sku.hidden = !d.sku; sku.textContent = d.sku ? 'SKU ' + d.sku : '';

      $('pStock').textContent = d.stock;
      $('pMin').textContent = 'Mínimo: ' + d.stock_minimo;
      var est = $('pEstado'); est.innerHTML = '';
      var e = estadoStock(d.stock, d.stock_minimo);
      est.appendChild(badge(e, ETIQUETA[e]));

      var desc = $('pDesc');
      desc.textContent = d.descripcion || 'Sin descripción.';
      desc.style.opacity = d.descripcion ? '1' : '.6';

      var extra = $('pExtra'); extra.innerHTML = '';
      extra.hidden = d.precio_venta === undefined;
      if (d.precio_venta !== undefined) {
        [['Precio de compra', d.precio_compra], ['Precio de venta', d.precio_venta]].forEach(function (par) {
          var w = el('div'); w.appendChild(el('dt', null, par[0])); w.appendChild(el('dd', null, 'Bs ' + par[1])); extra.appendChild(w);
        });
      }
      var fecha = $('pFecha'), hayFecha = d.precio_venta !== undefined && !!d.precio_venta_actualizado;
      fecha.hidden = !hayFecha;
      fecha.textContent = hayFecha ? 'Precio de venta actualizado el ' + d.precio_venta_actualizado : '';

      var acc = $('pAcciones'); acc.innerHTML = '';
      if (d.puede_retirar) {
        var r = el('button', 'btn primary'); r.type = 'button';
        r.textContent = 'Retirar pieza';
        r.addEventListener('click', function () { dlgP.close(); abrirRetiro(d); });
        acc.appendChild(r);
      }
      if (d.puede_compat) {
        var m = el('button', 'btn keep-label'); m.type = 'button'; m.id = 'pCompatAdd';
        m.setAttribute('aria-expanded', 'false'); m.setAttribute('aria-controls', 'pCompatBuscar');
        m.appendChild(icono('i-plus')); m.appendChild(el('span', null, 'Añadir producto compatible'));
        m.addEventListener('click', alternarBuscar);
        acc.appendChild(m);
      }
      if (d.editar_url) {
        var ed = el('a', 'btn', 'Editar producto'); ed.href = d.editar_url; acc.appendChild(ed);
      }

      pintarCompat(d);
    }

    function mostrar(url, d) {
      actualUrl = url; actual = d;
      pintarDetalle(d);
      if (!dlgP.open) dlgP.showModal();
      dlgP.scrollTop = 0;
    }
    function cargar(url, despues) {
      pedir(url).then(despues).catch(function () { window.alert('No se pudo cargar el producto. Inténtalo de nuevo.'); });
    }
    // Desde una lista: empieza un recorrido nuevo
    function abrirDetalle(url) { cargar(url, function (d) { pila = []; mostrar(url, d); }); }
    // Desde un compatible: se recuerda por dónde se venía
    function irA(url) {
      cargar(url, function (d) { pila.push({ url: actualUrl, nombre: actual.nombre }); mostrar(url, d); });
    }
    function volver() {
      if (!pila.length) return;
      var previo = pila[pila.length - 1];
      cargar(previo.url, function (d) { pila.pop(); mostrar(previo.url, d); });
    }
    $('pVolver').addEventListener('click', volver);

    $('pCerrar').addEventListener('click', function () { dlgP.close(); });
    dlgP.addEventListener('click', function (e) { if (e.target === dlgP) dlgP.close(); });
    dlgP.addEventListener('close', function () { pila = []; actual = null; seqBuscar++; detenerAuto(); pausadoPorUsuario = false; });

    TL.producto = { abrirDetalle: abrirDetalle, abrirRetiro: abrirRetiroDesde };
  })();
</script>
