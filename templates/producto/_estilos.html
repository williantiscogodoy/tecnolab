{# Estilos compartidos: cajas/lista de productos, cuadro de detalle, retiro y compatibles #}
<style>
  .view-toggle { display: inline-flex; padding: 0.22rem; gap: 0.2rem; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); }
  .view-toggle button { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.42rem 0.75rem; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 0.85rem; font-weight: 600; transition: background-color 0.2s, color 0.2s; }
  .view-toggle button:hover { color: var(--text); }
  .view-toggle button[aria-pressed="true"] { background: var(--surface); color: var(--primary); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25); }
  .view-toggle .ico { width: 16px; height: 16px; }

  /* ---------- Tarjetas (cajas) ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
  .group-title { grid-column: 1 / -1; display: flex; align-items: center; gap: 0.6rem; margin-top: 0.4rem; font-size: 0.95rem; font-weight: 700; }
  .group-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .group-title:first-child { margin-top: 0; }
  .group-title .ico { width: 18px; height: 18px; color: var(--primary); }

  .card { display: flex; flex-direction: column; gap: 0.9rem; padding: 1rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px; cursor: pointer; transition: border-color 0.25s, transform 0.3s var(--ease); }
  .card:hover { border-color: rgba(59, 130, 246, 0.4); transform: translateY(-2px); }
  .card.tec { border-left: 3px solid var(--primary); }
  .card-top { display: flex; gap: 0.8rem; align-items: flex-start; min-width: 0; }
  .card .thumb { width: 60px; height: 60px; flex: none; border-radius: 13px; object-fit: cover; background: var(--surface); border: 1px solid var(--border); }
  .card .thumb.ph { display: grid; place-items: center; color: var(--muted); }
  .card h3 { font-size: 0.98rem; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
  .card-open { all: unset; cursor: pointer; }
  .card-open:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: 4px; }
  .card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.5rem; margin-top: 0.3rem; font-size: 0.78rem; color: var(--muted); }
  .card-stock { display: flex; align-items: flex-end; justify-content: space-between; gap: 0.6rem; }
  .card-stock .n { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .card-stock .n small { font-size: 0.78rem; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 0.3rem; }
  .card .btn { width: 100%; }
  .card .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ---------- Vista en lista ---------- */
  .vista-lista .grid { grid-template-columns: minmax(0, 1fr); gap: 0.55rem; }
  .vista-lista .card { display: grid; grid-template-columns: minmax(0, 1fr) 230px 170px; grid-template-areas: "top stock actions"; align-items: center; gap: 1rem; padding: 0.7rem 1rem; }
  .vista-lista .card:hover { transform: none; }
  .vista-lista .card-top { grid-area: top; align-items: center; }
  .vista-lista .card .thumb { width: 46px; height: 46px; border-radius: 11px; }
  .vista-lista .card-stock { grid-area: stock; justify-content: flex-start; align-items: center; gap: 0.9rem; }
  .vista-lista .card-stock .n { font-size: 1.35rem; }
  .vista-lista .card-actions { grid-area: actions; }
  .vista-lista .card-actions:empty { display: none; }

  /* ---------- Cuadros emergentes ---------- */
  dialog { margin: auto; padding: 0; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7); max-height: calc(100dvh - 2rem); }
  dialog[open] { animation: pop 0.4s var(--ease); }
  dialog::backdrop { background: rgba(2, 6, 18, 0.62); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(0.97); } to { opacity: 1; transform: none; } }
  #dlgRetiro { width: min(520px, calc(100vw - 2rem)); max-height: calc(100dvh - 2rem); overflow-y: auto; }
  #dlgRetiro .field { display: grid; gap: 0.4rem; }
  .r-precios { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.7rem; }
  .r-precios div { padding: 0.6rem 0.85rem; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); }
  .r-precios small { display: block; color: var(--muted); font-size: 0.76rem; }
  .r-precios strong { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .r-fila { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 0.9rem; align-items: start; }
  .r-fila .stepper { grid-template-columns: 42px 1fr 42px; }
  .r-fila .stepper input { font-size: 1.15rem; min-width: 0; }
  .r-total { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: baseline; padding: 0.7rem 0.9rem; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); font-size: 0.88rem; color: var(--muted); }
  .r-total strong { color: var(--text); font-size: 1.15rem; font-variant-numeric: tabular-nums; margin-left: 0.3rem; }
  .r-total .pos { color: var(--ok); font-weight: 600; }
  .r-total .neg { color: var(--danger); font-weight: 600; }
  .r-aviso { color: var(--warn); font-size: 0.84rem; line-height: 1.4; margin-top: -0.4rem; }
  .r-sel { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.8rem; border-radius: 12px; border: 1.5px solid rgba(59, 130, 246, 0.5); background: rgba(59, 130, 246, 0.08); }
  .r-av { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; color: #fff; background: linear-gradient(135deg, #3b82f6, #22d3ee); }
  .r-txt { display: grid; min-width: 0; flex: 1; }
  .r-txt strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-txt small { color: var(--muted); font-size: 0.78rem; }
  .r-txt small.debe { color: var(--danger); font-weight: 600; }
  .r-link { align-self: flex-start; border: 0; background: none; padding: 0.2rem 0; color: var(--primary); font-weight: 600; font-size: 0.86rem; }
  .r-link:hover { text-decoration: underline; }
  .r-sel .r-link { align-self: center; }
  #rBuscar { display: grid; gap: 0.5rem; }
  .r-res { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.25rem; max-height: 190px; overflow-y: auto; }
  .r-res button { width: 100%; display: flex; align-items: center; gap: 0.7rem; padding: 0.45rem 0.55rem; border-radius: 11px; border: 1px solid transparent; background: transparent; text-align: left; }
  .r-res button:hover, .r-res button:focus-visible { background: var(--hover); border-color: var(--border); }
  .r-res .r-av { width: 30px; height: 30px; font-size: 0.8rem; }
  .r-vacio { color: var(--muted); font-size: 0.86rem; padding: 0.2rem 0.1rem; }
  .r-nuevo { display: grid; gap: 0.5rem; padding: 0.8rem; border-radius: 12px; border: 1px dashed var(--border); }
  .r-nuevo[hidden], #rClienteSel[hidden], #rBuscar[hidden], .r-err[hidden], .r-aviso[hidden] { display: none; }
  .r-err { color: var(--danger); font-size: 0.84rem; font-weight: 600; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0.4rem; padding: 0.3rem; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
  .seg label { position: relative; display: grid; place-items: center; padding: 0.55rem 0.4rem; border-radius: 9px; font-size: 0.9rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: background-color 0.2s, color 0.2s; }
  .seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .seg label:has(input:checked) { background: var(--primary); color: #fff; }
  .seg label:has(input[value="FIADO"]:checked) { background: var(--danger); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
  @media (max-width: 520px) { .r-fila { grid-template-columns: minmax(0, 1fr); } }
  .dlg { padding: 1.5rem; display: grid; gap: 1.1rem; }
  .dlg h2 { font-size: 1.15rem; letter-spacing: -0.01em; }
  .dlg .who { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
  .dlg .who strong { color: var(--text); }
  .stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 0.5rem; }
  .stepper button { border: 1px solid var(--border); background: var(--surface-2); border-radius: 12px; display: grid; place-items: center; transition: background-color 0.2s; }
  .stepper button:hover { background: var(--hover); }
  .stepper input { text-align: center; font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .dlg .btns { display: flex; justify-content: flex-end; gap: 0.7rem; }

  /* Detalle del producto */
  #dlgProd { width: min(780px, calc(100vw - 2rem)); overflow: auto; }
  .pd { position: relative; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 1.4rem; padding: 1.4rem; }
  .pd-close { position: absolute; top: 0.8rem; right: 0.8rem; z-index: 3; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; border: 1px solid var(--border); background: var(--surface); }
  .pd-close:hover { background: var(--surface-2); }
  .pd-main { position: relative; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); }
  .pd-main img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .pd-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 50%; color: #fff; background: rgba(2, 6, 18, 0.6); }
  .pd-nav:hover { background: rgba(2, 6, 18, 0.85); }
  .pd-nav.prev { left: 0.6rem; } .pd-nav.next { right: 0.6rem; }
  .pd-count { position: absolute; bottom: 0.6rem; left: 50%; transform: translateX(-50%); padding: 0.15rem 0.6rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; color: #fff; background: rgba(2, 6, 18, 0.65); }
  .pd-thumbs { display: flex; gap: 0.5rem; margin-top: 0.6rem; overflow-x: auto; padding-bottom: 0.2rem; }
  .pd-thumbs button { flex: none; width: 56px; height: 56px; padding: 0; border-radius: 11px; overflow: hidden; border: 2px solid transparent; background: var(--surface-2); opacity: 0.65; transition: opacity 0.2s, border-color 0.2s; }
  .pd-thumbs button[aria-current="true"] { border-color: var(--primary); opacity: 1; }
  .pd-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pd-info { display: flex; flex-direction: column; gap: 0.9rem; min-width: 0; padding-top: 0.2rem; }
  .pd-badges { display: flex; flex-wrap: wrap; gap: 0.4rem; padding-right: 2.6rem; }
  .pd-info h2 { font-size: 1.4rem; letter-spacing: -0.02em; line-height: 1.2; }
  .pd-sku { color: var(--muted); font-size: 0.88rem; margin-top: -0.5rem; }
  .pd-stock { display: flex; align-items: flex-end; gap: 0.8rem; padding: 0.9rem 1rem; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); }
  .pd-stock .n { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .pd-stock small { color: var(--muted); font-size: 0.82rem; display: block; }
  .pd-desc { color: var(--muted); font-size: 0.92rem; line-height: 1.55; white-space: pre-line; }
  .pd-extra { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .pd-extra div { padding: 0.6rem 0.8rem; border-radius: 12px; border: 1px solid var(--border); }
  .pd-extra dt { font-size: 0.75rem; color: var(--muted); }
  .pd-extra dd { font-weight: 700; font-variant-numeric: tabular-nums; }
  .pd-auto { position: absolute; bottom: 0.5rem; left: 0.6rem; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; border: 0; color: #fff; background: rgba(2, 6, 18, 0.65); transition: background-color 0.2s; }
  .pd-auto:hover { background: rgba(2, 6, 18, 0.85); }
  .pd-fecha { margin-top: -0.35rem; color: var(--muted); font-size: 0.8rem; }
  .pd-actions { display: flex; gap: 0.6rem; margin-top: auto; flex-wrap: wrap; }
  .pd-actions .btn { flex: 1; }

  /* El atributo hidden debe ganar a los display de los componentes del cuadro de detalle */
  #dlgProd [hidden] { display: none !important; }

  /* El botón de compatibles ocupa su propia fila para que el texto no se apriete */
  .pd-actions #pCompatAdd { flex: 1 1 100%; order: 3; }
  .pd-actions .btn .ico { width: 16px; height: 16px; }

  /* Volver al producto anterior (al navegar entre compatibles) */
  .pd-volver { display: inline-flex; align-items: center; gap: 0.35rem; align-self: flex-start; max-width: calc(100% - 2.8rem); padding: 0.25rem 0.75rem 0.25rem 0.45rem; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 0.8rem; font-weight: 600; transition: color 0.2s, background-color 0.2s; }
  .pd-volver:hover { color: var(--text); background: var(--hover); }
  .pd-volver .ico { width: 14px; height: 14px; flex: none; }
  .pd-volver span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Productos compatibles ---------- */
  .pd-compat { grid-column: 1 / -1; display: grid; gap: 0.8rem; padding-top: 1.1rem; border-top: 1px solid var(--border); }
  .pd-compat-head h3 { font-size: 1rem; letter-spacing: -0.01em; }
  .pd-compat-head h3 small { color: var(--muted); font-weight: 600; margin-left: 0.3rem; }
  .pd-compat-head p { color: var(--muted); font-size: 0.82rem; margin-top: 0.15rem; }
  .cp-msg { font-size: 0.85rem; font-weight: 600; color: var(--ok); }
  .cp-msg.err { color: var(--danger); }
  :root[data-theme="light"] .cp-msg { color: #047857; }
  :root[data-theme="light"] .cp-msg.err { color: #be123c; }

  .cp-lista { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.6rem; }
  .cp { position: relative; display: flex; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-2); transition: border-color 0.2s; }
  .cp:hover, .cp:focus-within { border-color: rgba(59, 130, 246, 0.45); }
  .cp-main, .cp-opt { display: flex; align-items: center; gap: 0.7rem; min-width: 0; width: 100%; padding: 0.55rem 0.7rem; border: 0; background: transparent; text-align: left; border-radius: 14px; }
  .cp-main { padding-right: 2.6rem; }
  .cp-thumb { width: 44px; height: 44px; flex: none; border-radius: 11px; object-fit: cover; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); }
  .cp-txt { display: grid; gap: 0.12rem; min-width: 0; }
  .cp-name { font-size: 0.9rem; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cp-sub { display: flex; align-items: center; gap: 0.4rem; font-size: 0.76rem; color: var(--muted); }
  .cp-sub .badge { padding: 0.08rem 0.5rem; font-size: 0.72rem; }
  .cp-x { position: absolute; top: 50%; right: 0.5rem; transform: translateY(-50%); width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; border: 0; background: transparent; color: var(--muted); transition: color 0.2s, background-color 0.2s; }
  .cp-x:hover { color: var(--danger); background: var(--danger-bg); }
  .cp-x .ico { width: 16px; height: 16px; }
  .cp-vacio { color: var(--muted); font-size: 0.9rem; padding: 0.4rem 0; }

  .cp-buscar { display: grid; gap: 0.6rem; padding: 0.8rem; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-2); }
  .cp-buscar .input { background: var(--surface); }
  .cp-res { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.25rem; max-height: 250px; overflow-y: auto; }
  .cp-opt { border: 1px solid transparent; border-radius: 11px; }
  .cp-opt:hover, .cp-opt:focus-visible { background: var(--hover); border-color: var(--border); }
  .cp-opt .cp-txt { flex: 1; }
  .cp-add { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; color: var(--primary); background: rgba(59, 130, 246, 0.14); }
  .cp-add .ico { width: 16px; height: 16px; }
  .cp-nores { color: var(--muted); font-size: 0.88rem; padding: 0.3rem 0.2rem; }

  /* Tarjetas de la lista del administrador */
  .card .card-price { font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card.is-off { opacity: 0.65; }
  .card .card-actions .row-actions { justify-content: flex-start; }

  @media (max-width: 860px) {
    .vista-lista .card { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "top actions" "stock actions"; gap: 0.5rem 0.8rem; }
    .vista-lista .card-actions .btn span { display: none; }
    .vista-lista .card-actions .btn { padding: 0.7rem; }
    .pd { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .view-toggle button span { display: none; }
  }
</style>
