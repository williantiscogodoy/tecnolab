{# Estilos compartidos de la sección Usuarios #}
<style>
  .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
  .tab { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.5rem 0.95rem; border-radius: 999px; font-size: 0.88rem; font-weight: 600; color: var(--muted); border: 1px solid var(--border); transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
  .tab:hover { color: var(--text); background: var(--hover); }
  .tab[aria-current="true"] { color: var(--primary); border-color: rgba(59, 130, 246, 0.45); background: rgba(59, 130, 246, 0.12); }
  .tab .ico { width: 16px; height: 16px; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1.2rem; margin-bottom: 1.2rem; }
  .row-actions { display: flex; gap: 0.35rem; justify-content: flex-end; }
  .act { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--muted); transition: color 0.2s, background-color 0.2s, border-color 0.2s; }
  .act:hover { color: var(--text); background: var(--hover); }
  .act.danger:hover { color: var(--danger); background: var(--danger-bg); border-color: transparent; }
  .act .ico { width: 17px; height: 17px; }
  .avatar-c { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; background: linear-gradient(135deg, #3b82f6, #22d3ee); }
  .cell-user { display: flex; align-items: center; gap: 0.8rem; min-width: 0; }
  .money { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .debe { color: var(--danger); font-weight: 700; }
  :root[data-theme="light"] .debe { color: #be123c; }
  .alday { color: var(--muted); }
  .badge.parcial { background: var(--warn-bg); color: var(--warn); }
  .badge.efectivo { background: var(--ok-bg); color: var(--ok); }
  .badge.qr { background: rgba(59, 130, 246, 0.16); color: var(--primary); }
  .badge.fiado { background: var(--danger-bg); color: var(--danger); }
  .badge.off { background: var(--hover); color: var(--muted); }
  :root[data-theme="light"] .badge.efectivo { color: #047857; }
  :root[data-theme="light"] .badge.fiado { color: #be123c; }

  dialog { margin: auto; width: min(460px, calc(100vw - 2rem)); padding: 0; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7); max-height: calc(100dvh - 2rem); overflow: auto; }
  dialog[open] { animation: pop 0.4s var(--ease); }
  dialog::backdrop { background: rgba(2, 6, 18, 0.62); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(0.97); } to { opacity: 1; transform: none; } }
  .dlg { padding: 1.5rem; }
  .dlg h2 { font-size: 1.15rem; letter-spacing: -0.01em; }
  .dlg > p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; margin-top: 0.4rem; }
  .dlg .field { margin-top: 1.1rem; }
  .dlg .btns { display: flex; justify-content: flex-end; gap: 0.7rem; margin-top: 1.5rem; flex-wrap: wrap; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0.4rem; padding: 0.3rem; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
  .seg label { position: relative; display: grid; place-items: center; padding: 0.55rem 0.4rem; border-radius: 9px; font-size: 0.9rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: background-color 0.2s, color 0.2s; }
  .seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .seg label:has(input:checked) { background: var(--primary); color: #fff; }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
  @media (max-width: 520px) { .summary { gap: 0.8rem; } }

  .stat { display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.3rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .stat .chip { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .stat .chip.in { color: var(--ok); background: var(--ok-bg); }
  .stat .chip.out { color: var(--danger); background: var(--danger-bg); }
  .stat .chip.cash { color: var(--primary); background: rgba(59, 130, 246, 0.14); }
  .stat small { display: block; color: var(--muted); font-size: 0.84rem; }
  .stat strong { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat .sub-n { display: block; color: var(--muted); font-size: 0.8rem; font-weight: 500; margin-top: 0.1rem; letter-spacing: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: flex-end; margin-bottom: 1.1rem; }
  .search { position: relative; flex: 1 1 220px; min-width: 0; align-self: flex-end; }
  .search .ico { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; pointer-events: none; }
  .search .input { padding-left: 2.6rem; }
  .pills { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 1.1rem; }
  .pill { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.5rem 0.9rem; border-radius: 999px; font-size: 0.88rem; font-weight: 600; color: var(--muted); border: 1px solid var(--border); transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
  .pill:hover { color: var(--text); background: var(--hover); }
  .pill[aria-current="true"] { color: var(--primary); border-color: rgba(59, 130, 246, 0.45); background: rgba(59, 130, 246, 0.12); }
  .pill small { font-weight: 600; opacity: 0.75; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.88rem; color: var(--muted); }
  .pager .btns { display: flex; gap: 0.5rem; }
  .empty .btn { margin-top: 0.6rem; }
</style>
